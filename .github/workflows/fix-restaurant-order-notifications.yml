name: Apply restaurant order notification fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip restaurant notification fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch restaurant admin
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/restaurant-admin/page.tsx')
          s = p.read_text()
          s = s.replace(
              'import { FUSE_ORDER_STATUSES, normalizeFuseOrderStatus } from "@/lib/fuse-order-status";\n',
              'import { FUSE_ORDER_STATUSES, normalizeFuseOrderStatus } from "@/lib/fuse-order-status";\nimport { notifyOrderStatusChange } from "@/lib/fuse-order-notifications";\n'
          )
          s = s.replace(
              '  customerPhone?: string;\n',
              '  customerPhone?: string;\n  customerUid?: string;\n'
          )
          old = '''  async function updateOrder(order: OrderDoc, status: string) {\n    if (!assertManage() || order.restaurantId !== selectedId) return;\n    try {\n      const canonical = normalizeFuseOrderStatus(status);\n      await updateDoc(doc(db, "orders", order.documentId), {\n        status: canonical,\n        statusAr: canonical,\n        restaurantUpdatedAt: serverTimestamp(),\n        updatedAt: serverTimestamp(),\n      });\n      flash(`تم تحديث الطلب إلى ${canonical}.`);\n    } catch (e) {\n      flash(e instanceof Error ? e.message : "تعذر تحديث الطلب.", true);\n    }\n  }\n'''
          new = '''  async function updateOrder(order: OrderDoc, status: string) {\n    if (!assertManage() || order.restaurantId !== selectedId) return;\n    try {\n      const canonical = normalizeFuseOrderStatus(status);\n      const previous = normalizeFuseOrderStatus(order.status);\n      await updateDoc(doc(db, "orders", order.documentId), {\n        status: canonical,\n        statusAr: canonical,\n        restaurantUpdatedAt: serverTimestamp(),\n        updatedAt: serverTimestamp(),\n      });\n\n      if (order.customerUid && previous !== canonical) {\n        try {\n          await notifyOrderStatusChange({\n            customerUid: order.customerUid,\n            orderDocumentId: order.documentId,\n            orderId: order.orderId || order.documentId,\n            status: canonical,\n          });\n        } catch {\n          flash(`تم تحديث الطلب إلى ${canonical} لكن تعذر إرسال إشعار للزبون.`, true);\n          return;\n        }\n      }\n\n      flash(`تم تحديث الطلب إلى ${canonical}.`);\n    } catch (e) {\n      flash(e instanceof Error ? e.message : "تعذر تحديث الطلب.", true);\n    }\n  }\n'''
          if old not in s:
              raise SystemExit('Expected updateOrder block not found; aborting without changes')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/restaurant-admin/page.tsx .github/workflows/fix-restaurant-order-notifications.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: notify customers when restaurant updates order status [skip restaurant notification fix]'
          git rm .github/workflows/fix-restaurant-order-notifications.yml
          git commit -m 'chore: remove temporary notification patch workflow [skip restaurant notification fix]'
          git push
