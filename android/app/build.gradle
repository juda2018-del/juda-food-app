apply plugin: 'com.android.application'

// Keep on ext so Gradle Groovy methods/closures can read signing config safely.
ext.fuseKeystoreProperties = new Properties()
def keystorePropertiesFile = file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    ext.fuseKeystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

ext.fuseResolveSigningValue = { String propertyKey, String envKey ->
    def fromFile = fuseKeystoreProperties[propertyKey]
    if (fromFile) {
        return fromFile
    }
    def envValue = System.getenv(envKey)
    return envValue != null ? envValue : ''
}

android {
    namespace = "com.fuseiraq.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.fuseiraq.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def storePath = fuseKeystoreProperties['storeFile'] ?: System.getenv('FUSE_KEYSTORE_FILE') ?: ''
            if (storePath) {
                storeFile file(storePath)
                storePassword fuseResolveSigningValue('storePassword', 'FUSE_KEYSTORE_PASSWORD')
                keyAlias fuseKeystoreProperties['keyAlias'] ?: System.getenv('FUSE_KEY_ALIAS') ?: 'upload'
                keyPassword fuseResolveSigningValue('keyPassword', 'FUSE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def releaseStorePath = fuseKeystoreProperties['storeFile'] ?: System.getenv('FUSE_KEYSTORE_FILE') ?: ''
def releaseStorePassword = fuseResolveSigningValue('storePassword', 'FUSE_KEYSTORE_PASSWORD')
def releaseKeyPassword = fuseResolveSigningValue('keyPassword', 'FUSE_KEY_PASSWORD')

tasks.register('verifyFuseReleaseSigning') {
    doLast {
        if (!releaseStorePath || !releaseStorePassword || !releaseKeyPassword) {
            throw new GradleException(
                "FUSE release signing is not configured. Copy android/keystore.properties.example to android/app/keystore.properties, or set FUSE_KEYSTORE_FILE, FUSE_KEYSTORE_PASSWORD, FUSE_KEY_ALIAS, and FUSE_KEY_PASSWORD. Never commit the keystore or passwords."
            )
        }
        def store = file(releaseStorePath)
        if (!store.exists()) {
            throw new GradleException("FUSE release keystore not found at ${store.absolutePath}")
        }
    }
}

// Fail before package/sign so an unsigned AAB/APK is never written.
tasks.matching { it.name == 'bundleRelease' || it.name == 'assembleRelease' }.configureEach {
    dependsOn 'verifyFuseReleaseSigning'
}
afterEvaluate {
    tasks.matching { it.name == 'packageReleaseBundle' || it.name == 'packageRelease' }.configureEach {
        dependsOn 'verifyFuseReleaseSigning'
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
