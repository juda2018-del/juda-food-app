apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Keep signing inputs on ext so Gradle method/closures resolve them reliably.
ext.fuseKeystoreProperties = keystoreProperties
ext.fuseReleaseStorePath = (keystoreProperties['storeFile'] ?: System.getenv('FUSE_KEYSTORE_FILE') ?: '').toString()
ext.fuseReleaseStorePassword = (keystoreProperties['storePassword'] ?: System.getenv('FUSE_KEYSTORE_PASSWORD') ?: '').toString()
ext.fuseReleaseKeyAlias = (keystoreProperties['keyAlias'] ?: System.getenv('FUSE_KEY_ALIAS') ?: 'upload').toString()
ext.fuseReleaseKeyPassword = (keystoreProperties['keyPassword'] ?: System.getenv('FUSE_KEY_PASSWORD') ?: '').toString()
ext.fuseReleaseSigningConfigured = ext.fuseReleaseStorePath && ext.fuseReleaseStorePassword && ext.fuseReleaseKeyPassword

android {
    namespace = "com.fuseiraq.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.fuseiraq.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (fuseReleaseSigningConfigured) {
                storeFile file(fuseReleaseStorePath)
                storePassword fuseReleaseStorePassword
                keyAlias fuseReleaseKeyAlias
                keyPassword fuseReleaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (fuseReleaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Fail before packaging so an unsigned AAB/APK is never left as a release artifact.
gradle.taskGraph.whenReady { graph ->
    def releaseTaskNames = [
        'assembleRelease',
        'bundleRelease',
        'packageRelease',
        'packageReleaseBundle',
        'signReleaseBundle',
    ] as Set
    def needsSignedRelease = graph.allTasks.any { releaseTaskNames.contains(it.name) }
    if (!needsSignedRelease) {
        return
    }
    if (!fuseReleaseSigningConfigured) {
        throw new GradleException(
            "FUSE release signing is not configured. Copy android/keystore.properties.example to android/app/keystore.properties, or set FUSE_KEYSTORE_FILE, FUSE_KEYSTORE_PASSWORD, FUSE_KEY_ALIAS, and FUSE_KEY_PASSWORD. Never commit the keystore or passwords."
        )
    }
    def store = file(fuseReleaseStorePath)
    if (!store.exists()) {
        throw new GradleException("FUSE release keystore not found at ${store.absolutePath}")
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
