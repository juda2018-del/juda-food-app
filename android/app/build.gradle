apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveSigningValue(String propertyKey, String envKey) {
    if (keystoreProperties[propertyKey]) {
        return keystoreProperties[propertyKey]
    }
    def envValue = System.getenv(envKey)
    return envValue != null ? envValue : ''
}

android {
    namespace = "com.fuseiraq.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.fuseiraq.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def storePath = keystoreProperties['storeFile'] ?: System.getenv('FUSE_KEYSTORE_FILE') ?: ''
            if (storePath) {
                storeFile file(storePath)
                storePassword resolveSigningValue('storePassword', 'FUSE_KEYSTORE_PASSWORD')
                keyAlias keystoreProperties['keyAlias'] ?: System.getenv('FUSE_KEY_ALIAS') ?: 'upload'
                keyPassword resolveSigningValue('keyPassword', 'FUSE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "bundleRelease" || task.name == "assembleRelease") {
        task.doFirst {
            def storePath = keystoreProperties['storeFile'] ?: System.getenv('FUSE_KEYSTORE_FILE') ?: ''
            def storePassword = resolveSigningValue('storePassword', 'FUSE_KEYSTORE_PASSWORD')
            def keyPassword = resolveSigningValue('keyPassword', 'FUSE_KEY_PASSWORD')
            if (!storePath || !storePassword || !keyPassword) {
                throw new GradleException(
                    "FUSE release signing is not configured. Copy android/keystore.properties.example to android/app/keystore.properties, or set FUSE_KEYSTORE_FILE, FUSE_KEYSTORE_PASSWORD, FUSE_KEY_ALIAS, and FUSE_KEY_PASSWORD. Never commit the keystore or passwords."
                )
            }
            def store = file(storePath)
            if (!store.exists()) {
                throw new GradleException("FUSE release keystore not found at ${store.absolutePath}")
            }
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
