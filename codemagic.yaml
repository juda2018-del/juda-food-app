workflows:
  fuse-ios-build:
    name: FUSE iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      node: 20
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fuseiraq.app

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build Next.js app
        script: npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
          test -f ios/App/App/public/index.html
          test -f ios/App/App/PrivacyInfo.xcprivacy

      - name: Set App Store build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj

      - name: Set up iOS signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  fuse-android-build:
    name: FUSE Android AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 20
      java: 21
      vars:
        FUSE_KEYSTORE_FILE: upload-keystore.jks
        FUSE_KEY_ALIAS: upload

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Verify Java 21
        script: |
          java -version
          javac -version

      - name: Build Next.js app
        script: npm run build

      - name: Sync Capacitor Android
        script: |
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html
          test -f android/capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Configure Android signing secrets
        script: |
          if [ -z "$FUSE_KEYSTORE_PASSWORD" ] || [ -z "$FUSE_KEY_PASSWORD" ]; then
            echo "Set FUSE_KEYSTORE_PASSWORD and FUSE_KEY_PASSWORD in Codemagic environment."
            exit 1
          fi
          # Codemagic file secret is typically available as CM_KEYSTORE_PATH or the named file path.
          KEYSTORE_PATH="${FUSE_KEYSTORE_FILE}"
          if [ ! -f "$KEYSTORE_PATH" ] && [ -n "${CM_KEYSTORE_PATH:-}" ]; then
            KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          fi
          if [ ! -f "$KEYSTORE_PATH" ] && [ -f "$CM_BUILD_DIR/$FUSE_KEYSTORE_FILE" ]; then
            KEYSTORE_PATH="$CM_BUILD_DIR/$FUSE_KEYSTORE_FILE"
          fi
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Upload keystore file not found. Add file secret upload-keystore.jks and set FUSE_KEYSTORE_FILE."
            exit 1
          fi
          cp "$KEYSTORE_PATH" android/app/upload-keystore.jks
          cat > android/app/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${FUSE_KEYSTORE_PASSWORD}
          keyAlias=${FUSE_KEY_ALIAS:-upload}
          keyPassword=${FUSE_KEY_PASSWORD}
          EOF

      - name: Build signed Android App Bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --stacktrace

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/reports/**