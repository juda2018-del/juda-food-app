workflows:
  fuse-ios-build:
    name: FUSE iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      node: 20
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fuseiraq.app

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build Next.js app
        script: npm run build

      - name: Prepare iOS files
        script: |
          rm -rf ios/App/App/public
          mkdir -p ios/App/App/public
          cp -R out/* ios/App/App/public/

          cat > ios/App/App/capacitor.config.json <<'EOF'
          {
            "appId": "com.fuseiraq.app",
            "appName": "Fuse Iraq",
            "webDir": "public",
            "packageClassList": []
          }
          EOF

          cat > ios/App/App/config.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <widget id="com.fuseiraq.app" version="1.0.2">
            <name>Fuse Iraq</name>
          </widget>
          EOF

      - name: Set App Store build number
        script: |
          sed -i '' 's/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = 18;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Set up iOS signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  fuse-android-build:
    name: FUSE Android AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 20
      java: 21

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Verify Java 21
        script: |
          java -version
          javac -version

      - name: Build Next.js app
        script: npm run build

      - name: Prepare Android project
        script: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -R out/* android/app/src/main/assets/public/

          cat > android/app/src/main/assets/capacitor.config.json <<'EOF'
          {
            "appId": "com.fuseiraq.app",
            "appName": "Fuse Iraq",
            "webDir": "public",
            "packageClassList": []
          }
          EOF

          test -f android/app/src/main/assets/public/index.html

      - name: Build signed Android App Bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --stacktrace

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/reports/**